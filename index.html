<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <title>Loochies</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: 1fr auto;
        align-items: stretch;
        background: #0a0a0a;
      }
      #stage {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000; /* letterbox */
      }
      canvas {
        width: auto;
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        background: #000;
      }
      #hud {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        padding: env(safe-area-inset-bottom) 12px 12px 12px;
        background: rgba(0,0,0,0.85);
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
        font-size: 16px;
        line-height: 40px;
        user-select: none;
      }
      #hudTop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      #jobBar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        height: 44px;
        padding: 0 12px;
        border-radius: 10px;
        background: #1f8a5a;
        color: #fff;
        font-weight: 700;
        border: 2px solid #0e5;
        box-shadow: 0 2px 0 #083;
        touch-action: manipulation;
      }
      .btn.job { background:#2a2a2a; border-color:#666; box-shadow:0 2px 0 #222; }
      .btn.selected { outline:3px solid #0e5; }
      .btn.secondary {
        background: #444;
        border-color: #777;
        box-shadow: 0 2px 0 #222;
      }
      .btn[disabled] {
        opacity: 0.5;
      }
      #status {
        padding-left: 6px;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="stage">
        <canvas id="screen" aria-label="Loochies game"></canvas>
      </div>
      <div id="hud">
        <div id="hudTop">
          <div id="status">Loading…</div>
          <div>
            <button id="restartBtn" class="btn secondary" aria-label="Restart level">Restart</button>
            <button id="nextBtn" class="btn secondary" aria-label="Next level">Next</button>
            <button id="selectBtn" class="btn secondary" aria-label="Level select">Levels</button>
          </div>
        </div>
        <div id="jobBar">
          <button id="blockerBtn" class="btn job" aria-pressed="false" aria-label="Select Blocker">Blocker ×<span id="blockerCount">0</span></button>
          <button id="builderBtn" class="btn job" aria-pressed="false" aria-label="Select Builder">Builder ×<span id="builderCount">0</span></button>
          <button id="diggerBtn" class="btn job" aria-pressed="false" aria-label="Select Digger">Digger ×<span id="diggerCount">0</span></button>
          <button id="basherBtn" class="btn job" aria-pressed="false" aria-label="Select Basher">Basher ×<span id="basherCount">0</span></button>
          <button id="floaterBtn" class="btn job" aria-pressed="false" aria-label="Select Floater">Floater ×<span id="floaterCount">0</span></button>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.js?v=9"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = new URL('sw.js', window.location.href).toString();
          navigator.serviceWorker.register(swUrl).catch(()=>{});
        });
      }
    </script>
  </body>
</html>
