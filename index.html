<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <title>Loochies</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: 1fr auto;
        align-items: stretch;
      }
      canvas {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        background: #000;
      }
      #hud {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        padding: env(safe-area-inset-bottom) 12px 12px 12px;
        background: rgba(0,0,0,0.8);
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
        font-size: 16px;
        line-height: 40px;
        user-select: none;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        height: 44px;
        padding: 0 12px;
        border-radius: 10px;
        background: #1f8a5a;
        color: #fff;
        font-weight: 700;
        border: 2px solid #0e5;
        box-shadow: 0 2px 0 #083;
        touch-action: manipulation;
      }
      .btn.secondary {
        background: #444;
        border-color: #777;
        box-shadow: 0 2px 0 #222;
      }
      .btn[disabled] {
        opacity: 0.5;
      }
      #status {
        padding-left: 6px;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="screen" aria-label="Loochies game"></canvas>
      <div id="hud">
        <div id="status">Loading…</div>
        <button id="blockerBtn" class="btn" aria-pressed="false" aria-label="Select Blocker">Blocker ×<span id="blockerCount">5</span></button>
        <button id="restartBtn" class="btn secondary" aria-label="Restart level">Restart</button>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = new URL('sw.js', window.location.href).toString();
          navigator.serviceWorker.register(swUrl).catch(()=>{});
        });
      }
    </script>
  </body>
</html>
